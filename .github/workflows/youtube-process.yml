name: Process YouTube video for facial analysis

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: YouTube URL to process
        required: true
        type: string
      video_id:
        description: YouTube video ID
        required: true
        type: string
      object_key:
        description: R2 MP4 object key
        required: true
        type: string
      marker_key:
        description: R2 queued-job marker key
        required: true
        type: string
      error_key:
        description: R2 failure marker key
        required: true
        type: string
      job_mode:
        description: metadata or video
        required: false
        default: video
        type: string
      metadata_key:
        description: R2 metadata JSON key (metadata mode only)
        required: false
        default: ''
        type: string
      segment_start_seconds:
        description: Segment start in seconds (video mode)
        required: false
        default: '0'
        type: string
      segment_duration_seconds:
        description: Segment duration in seconds, 0 means full video
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: facial-youtube-${{ inputs.video_id }}-${{ inputs.job_mode }}-${{ inputs.segment_start_seconds }}-${{ inputs.segment_duration_seconds }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INPUT_YOUTUBE_URL: ${{ inputs.youtube_url }}
      INPUT_VIDEO_ID: ${{ inputs.video_id }}
      INPUT_OBJECT_KEY: ${{ inputs.object_key }}
      INPUT_MARKER_KEY: ${{ inputs.marker_key }}
      INPUT_ERROR_KEY: ${{ inputs.error_key }}
      INPUT_JOB_MODE: ${{ inputs.job_mode }}
      INPUT_METADATA_KEY: ${{ inputs.metadata_key }}
      INPUT_SEGMENT_START_SECONDS: ${{ inputs.segment_start_seconds }}
      INPUT_SEGMENT_DURATION_SECONDS: ${{ inputs.segment_duration_seconds }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # One proxy URL is enough. For free proxy pools, YOUTUBE_PROXY_URLS may contain
      # multiple proxy URLs separated by newlines, commas or semicolons.
      YOUTUBE_PROXY_URL: ${{ secrets.YOUTUBE_PROXY_URL }}
      YOUTUBE_PROXY_URLS: ${{ secrets.YOUTUBE_PROXY_URLS }}
      # Optional single dedicated YouTube session, base64-encoded Netscape cookies.txt.
      # This is server-side only; website users never provide cookies.
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node for PO-token provider
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ffmpeg and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          # Nightly yt-dlp is intentional: YouTube changes frequently. The default
          # dependency group installs yt-dlp-ejs, required for current JS challenges.
          python -m pip install --upgrade --pre "yt-dlp[default]"
          python -m pip install --upgrade boto3 bgutil-ytdlp-pot-provider
          python -m yt_dlp --version
          node --version

      - name: Build and start bgutil PO-token provider
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bgutil-ytdlp-pot-provider
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil-ytdlp-pot-provider
          cd /tmp/bgutil-ytdlp-pot-provider/server
          npm ci
          npx tsc
          nohup node build/main.js --port 4416 >/tmp/bgutil-provider.log 2>&1 &
          echo $! >/tmp/bgutil-provider.pid
          sleep 3
          if ! kill -0 "$(cat /tmp/bgutil-provider.pid)" 2>/dev/null; then
            cat /tmp/bgutil-provider.log || true
            exit 1
          fi
          echo "bgutil provider started"

      - name: Read metadata or prepare selected video segment
        shell: bash
        run: python scripts/process_youtube.py

      - name: Show PO-token provider log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/bgutil-provider.log ]; then
            tail -n 200 /tmp/bgutil-provider.log
          fi
