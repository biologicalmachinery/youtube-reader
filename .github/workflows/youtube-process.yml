name: Process YouTube video for facial analysis

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: YouTube URL to process
        required: true
        type: string
      video_id:
        description: YouTube video ID
        required: true
        type: string
      object_key:
        description: R2 MP4 object key
        required: true
        type: string
      marker_key:
        description: R2 queued-job marker key
        required: true
        type: string
      error_key:
        description: R2 failure marker key
        required: true
        type: string
      job_mode:
        description: metadata or video
        required: false
        default: video
        type: string
      metadata_key:
        description: R2 metadata JSON key (metadata mode only)
        required: false
        default: ''
        type: string
      short_video_object_key:
        description: Full-video R2 key used when metadata mode discovers a source <= 5 minutes
        required: false
        default: ''
        type: string
      short_video_marker_key:
        description: Full-video processing marker used for metadata-to-video promotion
        required: false
        default: ''
        type: string
      short_video_error_key:
        description: Full-video error key used for metadata-to-video promotion
        required: false
        default: ''
        type: string
      dispatch_requested_at_ms:
        description: Worker dispatch timestamp used for startup timing diagnostics
        required: false
        default: '0'
        type: string
      segment_start_seconds:
        description: Segment start in seconds (video mode)
        required: false
        default: '0'
        type: string
      segment_duration_seconds:
        description: Segment duration in seconds, 0 means full video
        required: false
        default: '0'
        type: string
      proxy_slot:
        description: Zero-based proxy slot leased by the Cloudflare Worker
        required: false
        default: ''
        type: string
      proxy_lease_token:
        description: Opaque lease token for the assigned proxy slot
        required: false
        default: ''
        type: string
      proxy_lease_key:
        description: R2 coordinator key for the assigned proxy slot
        required: false
        default: ''
        type: string
      proxy_site:
        description: Site key used by the Cloudflare proxy coordinator
        required: false
        default: youtube
        type: string

permissions:
  contents: read

concurrency:
  group: facial-youtube-${{ inputs.video_id }}-${{ inputs.job_mode }}-${{ inputs.segment_start_seconds }}-${{ inputs.segment_duration_seconds }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      INPUT_YOUTUBE_URL: ${{ inputs.youtube_url }}
      INPUT_VIDEO_ID: ${{ inputs.video_id }}
      INPUT_OBJECT_KEY: ${{ inputs.object_key }}
      INPUT_MARKER_KEY: ${{ inputs.marker_key }}
      INPUT_ERROR_KEY: ${{ inputs.error_key }}
      INPUT_JOB_MODE: ${{ inputs.job_mode }}
      INPUT_METADATA_KEY: ${{ inputs.metadata_key }}
      INPUT_SHORT_VIDEO_OBJECT_KEY: ${{ inputs.short_video_object_key }}
      INPUT_SHORT_VIDEO_MARKER_KEY: ${{ inputs.short_video_marker_key }}
      INPUT_SHORT_VIDEO_ERROR_KEY: ${{ inputs.short_video_error_key }}
      INPUT_DISPATCH_REQUESTED_AT_MS: ${{ inputs.dispatch_requested_at_ms }}
      INPUT_SEGMENT_START_SECONDS: ${{ inputs.segment_start_seconds }}
      INPUT_SEGMENT_DURATION_SECONDS: ${{ inputs.segment_duration_seconds }}
      INPUT_PROXY_SLOT: ${{ inputs.proxy_slot }}
      INPUT_PROXY_LEASE_TOKEN: ${{ inputs.proxy_lease_token }}
      INPUT_PROXY_LEASE_KEY: ${{ inputs.proxy_lease_key }}
      INPUT_PROXY_SITE: ${{ inputs.proxy_site }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # The Worker leases a zero-based slot. YOUTUBE_PROXY_URLS contains the matching
      # proxy URLs in stable line order. YOUTUBE_PROXY_URL remains a legacy fallback.
      YOUTUBE_PROXY_URL: ${{ secrets.YOUTUBE_PROXY_URL }}
      YOUTUBE_PROXY_URLS: ${{ secrets.YOUTUBE_PROXY_URLS }}
      # Optional single dedicated YouTube session, base64-encoded Netscape cookies.txt.
      # This is server-side only; website users never provide cookies.
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-youtube.txt

      - name: Set up Node for PO-token provider
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install only missing runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check --upgrade --pre "yt-dlp[default]"
          python -m pip install --disable-pip-version-check -r scripts/requirements-youtube.txt
          python -m yt_dlp --version
          ffmpeg -version | head -n 1
          node --version

      - name: Start prebuilt bgutil PO-token provider
        shell: bash
        run: |
          set -euo pipefail
          docker pull -q brainicism/bgutil-ytdlp-pot-provider:latest
          docker run --rm -d --name facial-bgutil-pot -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest >/tmp/bgutil-container-id
          python - <<'PY'
          import socket, time
          for _ in range(40):
              try:
                  with socket.create_connection(("127.0.0.1", 4416), timeout=0.5):
                      print("bgutil provider ready")
                      break
              except OSError:
                  time.sleep(0.25)
          else:
              raise SystemExit("bgutil provider did not become ready")
          PY

      - name: Read metadata or prepare selected video segment
        shell: bash
        run: python scripts/process_youtube.py

      - name: Show PO-token provider log on failure
        if: failure()
        shell: bash
        run: docker logs --tail 200 facial-bgutil-pot 2>/dev/null || true
