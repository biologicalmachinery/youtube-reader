
name: Update Webshare YouTube Proxies

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download and convert Webshare proxies
        env:
          WEBSHARE_DOWNLOAD_URL: ${{ secrets.WEBSHARE_DOWNLOAD_URL }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          from urllib.parse import quote

          url = os.environ["WEBSHARE_DOWNLOAD_URL"]

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "GitHub-Proxy-Sync/1.0"}
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              content = response.read().decode("utf-8-sig")

          proxies = []
          for line in content.splitlines():
              line = line.strip()
              if not line:
                  continue

              parts = line.split(":", 3)
              if len(parts) != 4:
                  raise ValueError("Invalid Webshare proxy record")

              host, port, username, password = parts
              if not host or not port.isdigit() or not username or not password:
                  raise ValueError("Invalid proxy credentials")

              proxy = (
                  f"http://{quote(username, safe='')}:"
                  f"{quote(password, safe='')}@{host}:{port}"
              )
              proxies.append(proxy)

          if not proxies:
              raise RuntimeError("Empty proxy list; refusing to overwrite secret")

          with open("proxies.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(dict.fromkeys(proxies)))

          print(f"Prepared {len(proxies)} proxies")
          PY

      - name: Update GitHub repository secret
        env:
          GH_TOKEN: ${{ secrets.PROXY_SYNC_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh secret set YOUTUBE_PROXY_URLS \
            --repo "$GH_REPO" < proxies.txt

          echo "Proxy secret synchronized successfully"
