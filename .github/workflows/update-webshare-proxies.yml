name: Update Webshare YouTube Proxies

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download, validate, and convert Webshare proxies
        env:
          WEBSHARE_DOWNLOAD_URL: ${{ secrets.WEBSHARE_DOWNLOAD_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.request
          from urllib.parse import quote, urlsplit

          url = os.environ.get('WEBSHARE_DOWNLOAD_URL', '').strip()
          if not url or urlsplit(url).scheme != 'https':
              raise SystemExit('WEBSHARE_DOWNLOAD_URL must be an HTTPS link')
          req = urllib.request.Request(url, headers={'User-Agent': 'GitHub-Proxy-Sync/1.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              content = response.read().decode('utf-8-sig')
          proxies = set()
          for line in content.splitlines():
              line = line.strip()
              if not line:
                  continue
              parts = line.split(':', 3)
              if len(parts) != 4:
                  raise ValueError('Unexpected Webshare record format (expected host:port:user:password)')
              host, port, username, password = parts
              if not host or not port.isdigit() or not (1 <= int(port) <= 65535) or not username or not password:
                  raise ValueError('Invalid Webshare proxy record')
              proxies.add(f"http://{quote(username, safe='')}:{quote(password, safe='')}@{host}:{port}")
          if not proxies:
              raise RuntimeError('Refusing to overwrite proxy secret with an empty list')
          # Deterministic ordering across repeated downloads avoids spurious slot remaps.
          with open('proxies.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(sorted(proxies)) + '\n')
          print(f'Validated {len(proxies)} proxy entries')
          PY

      - name: Update GitHub repository secret
        env:
          GH_TOKEN: ${{ secrets.PROXY_SYNC_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh secret set YOUTUBE_PROXY_URLS --repo "$GH_REPO" < proxies.txt
          echo 'YOUTUBE_PROXY_URLS synchronized'
